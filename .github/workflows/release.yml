name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No release keystore secret; APK will use debug signing."
          fi

      - name: Build release APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          # tag v1.2.3 -> versionName 1.2.3, versionCode 10203
          VERSION_NAME="${VERSION_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          export VERSION_NAME
          export VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + ${PATCH:-0} ))
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "QRScanner-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "QRScanner-${{ github.ref_name }}.apk" \
            --title "QR Scanner ${{ github.ref_name }}" \
            --generate-notes
